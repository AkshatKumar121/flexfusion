name: FlexFusion CI

on:
  push:
    branches:
      - flexfusion_v1
  pull_request:
    branches:
      - flexfusion_v1
  workflow_dispatch:
    inputs:
      run_ios:
        description: "Build and run the iOS simulator integration suite"
        required: false
        type: boolean
        default: false
      run_android:
        description: "Build and run the Android emulator integration suite"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flexfusion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze --no-pub

      - name: Run unit, widget and quality workflow tests with coverage
        run: flutter test --no-pub --coverage --reporter expanded

      - name: Upload LCOV coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexfusion-coverage-${{ github.run_number }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  android-emulator:
    name: Android emulator integration
    if: github.event_name == 'workflow_dispatch' && inputs.run_android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run app integration journey on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/app_smoke_test.dart -d emulator-5554 --reporter expanded

  ios-simulator:
    name: iOS simulator integration and build
    if: github.event_name == 'workflow_dispatch' && inputs.run_ios
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign

      - name: Boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "device_id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run end-to-end app flow
        run: flutter test integration_test/app_smoke_test.dart -d "${{ steps.simulator.outputs.device_id }}" --reporter expanded

      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown all || true
